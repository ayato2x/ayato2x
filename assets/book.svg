<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-label="An open book whose pages turn, beside a short note about a shipped project.">
  <title>Kholasat El-English — a shipped platform</title>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061109"/>
      <stop offset="100%" stop-color="#0A1C12"/>
    </linearGradient>

    <!-- page shading: the gutter side is always darker -->
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"  stop-color="#CFC8B4"/>
      <stop offset="18%" stop-color="#EFEBE0"/>
      <stop offset="100%" stop-color="#F6F4ED"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#CFC8B4"/>
      <stop offset="18%" stop-color="#EFEBE0"/>
      <stop offset="100%" stop-color="#F6F4ED"/>
    </linearGradient>
    <!-- the leaf in flight catches light across its face -->
    <linearGradient id="flip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FBF9F3"/>
      <stop offset="55%"  stop-color="#E7E2D4"/>
      <stop offset="100%" stop-color="#C7BFA9"/>
    </linearGradient>

    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="card2"><rect width="1200" height="300" rx="10"/></clipPath>

    <style>
      .fade2 { animation: fade2 .8s ease-out backwards; }
      @keyframes fade2 { from { opacity: 0; transform: translateY(10px); } }
      @media (prefers-reduced-motion: reduce) {
        .fade2 { animation: none; }
        .leaf, .leafShade { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card2)">
    <rect width="1200" height="300" fill="url(#bg2)"/>

    <!-- ── the book, drawn flat-on with a fake fold ───────────── -->
    <g transform="translate(126 30) scale(1.14)">
      <!-- board + fore-edges -->
      <path d="M-14 26 L0 14 0 214 -14 226Z" fill="#04120A"/>
      <path d="M474 26 L460 14 460 214 474 226Z" fill="#04120A"/>
      <rect x="0" y="14" width="460" height="200" rx="3" fill="#0A2015"/>

      <!-- settled pages -->
      <path d="M10 20 L228 30 228 206 10 200Z" fill="url(#pageL)"/>
      <path d="M450 20 L232 30 232 206 450 200Z" fill="url(#pageR)"/>

      <!-- ruled lines on the resting spread -->
      <g stroke="#0A2015" stroke-opacity="0.16" stroke-width="1">
        <path d="M28 62H214M28 84H214M28 106H214M28 128H196M250 64H436M250 86H436M250 108H436M250 130H414"/>
      </g>
      <!-- a green marked rule, like a highlighted rule in a grammar note -->
      <path d="M250 152H366" stroke="#0B7A45" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 150H140" stroke="#B98A32" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>

      <!--
        The turning leaf. SMIL morphs the outline itself: the free edge sweeps
        from the right board across the gutter to the left, narrowing as it
        passes overhead, which is what sells the fold without needing 3D.
      -->
      <path class="leaf" fill="url(#flip)" stroke="#0A2015" stroke-opacity="0.14" stroke-width="1"
            d="M232 30 L450 20 450 200 232 206Z">
        <animate attributeName="d" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.06;0.18;0.30;0.42;0.50;1"
          values="
            M232 30 L450 20 450 200 232 206Z;
            M232 30 L438 16 442 202 232 206Z;
            M232 30 L338 2  346 196 232 206Z;
            M232 30 L246 0  252 192 232 206Z;
            M232 30 L128 6  132 198 232 206Z;
            M232 30 L14  20 14  200 232 206Z;
            M232 30 L14  20 14  200 232 206Z"/>
        <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.045;0.07;0.46;0.50;1" values="0;0;1;1;0;0"/>
      </path>

      <!-- the shadow the leaf throws into the gutter as it passes -->
      <path class="leafShade" fill="#04120A" opacity="0">
        <animate attributeName="d" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.18;0.30;0.42;1"
          values="
            M232 30 L232 30 232 206 232 206Z;
            M232 30 L300 20 304 200 232 206Z;
            M232 30 L246 14 250 198 232 206Z;
            M232 30 L180 18 184 200 232 206Z;
            M232 30 L232 30 232 206 232 206Z"/>
        <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.14;0.30;0.46;1" values="0;0.16;0.28;0.10;0"/>
      </path>

      <!-- gutter + spine cap sit above the leaf so the fold looks anchored -->
      <path d="M228 30 L232 30 232 206 228 206Z" fill="#0A2015" opacity="0.55"/>
      <rect x="224" y="16" width="12" height="198" fill="#04120A" opacity="0.35"/>
    </g>

    <!-- ── the note beside it ─────────────────────────────────── -->
    <g class="fade2" style="animation-delay:.15s">
      <text x="700" y="92" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
            font-size="11.5" letter-spacing="3.4" fill="#17B95E">SHIPPED · 2026</text>
      <text x="700" y="138" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
            font-size="34" fill="#F6F4ED">Kholasat El-English</text>
      <text x="700" y="170" font-family="Georgia,'Times New Roman',serif" font-style="italic"
            font-size="17" fill="#F6F4ED" fill-opacity="0.55">An Arabic, right-to-left learning platform.</text>
      <text x="700" y="206" font-family="system-ui,'Segoe UI',Tahoma,sans-serif" font-size="15"
            fill="#F6F4ED" fill-opacity="0.72">37 screens · 4 roles · a 3D book that closes as you scroll</text>
      <line x1="700" y1="230" x2="1010" y2="230" stroke="#F6F4ED" stroke-opacity="0.14"/>
      <text x="700" y="256" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
            font-size="12" letter-spacing="1.5" fill="#E3B44F">ayato2x.github.io/kholasat-english-platform</text>
    </g>

    <rect width="1200" height="300" filter="url(#grain2)" opacity="0.05"/>
    <rect x=".5" y=".5" width="1199" height="299" rx="10" fill="none"
          stroke="#F6F4ED" stroke-opacity="0.12"/>
  </g>
</svg>
