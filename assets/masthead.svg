<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"
     role="img" aria-label="Ayato — full-stack developer. React, TypeScript, Node, MongoDB.">
  <title>Ayato — full-stack developer</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#061109"/>
      <stop offset="55%"  stop-color="#0B2116"/>
      <stop offset="100%" stop-color="#050D08"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#17B95E" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#17B95E" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#17B95E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F6F4ED"/>
      <stop offset="62%"  stop-color="#F6F4ED"/>
      <stop offset="82%"  stop-color="#E3B44F"/>
      <stop offset="100%" stop-color="#B98A32"/>
    </linearGradient>

    <!-- paper fibre, rendered once -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="10"/></clipPath>
    <clipPath id="wordmask"><rect x="70" y="96" width="700" height="96"/></clipPath>

    <style>
      /* Base styles are the FINISHED state, and every entrance uses
         animation-fill-mode: backwards. If animation is unavailable — reduced
         motion, an old renderer — the card still reads correctly instead of
         being stuck on a hidden first frame. */
      .rise    { animation: rise .9s cubic-bezier(.22,1,.36,1) backwards; }
      .fade    { animation: fade .8s ease-out backwards; }
      .draw    { stroke-dasharray: 1100; animation: draw 1.5s cubic-bezier(.22,1,.36,1) backwards; }
      .drawsm  { stroke-dasharray: 260;  animation: drawsm 1.1s cubic-bezier(.22,1,.36,1) backwards; }
      .breathe { animation: breathe 14s ease-in-out infinite; transform-origin: 980px 150px; }
      .blink   { animation: blink 1.15s step-end infinite; }

      @keyframes rise   { from { transform: translateY(104px); } }
      @keyframes fade   { from { opacity: 0; transform: translateY(10px); } }
      @keyframes draw   { from { stroke-dashoffset: 1100; } }
      @keyframes drawsm { from { stroke-dashoffset: 260; } }
      @keyframes breathe{ 0%,100% { transform: scale(1) translate(0,0); opacity:.85 }
                          50%     { transform: scale(1.14) translate(-14px,10px); opacity:1 } }
      @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      @media (prefers-reduced-motion: reduce) {
        .rise,.fade,.draw,.drawsm,.breathe,.blink { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#ground)"/>
    <ellipse class="breathe" cx="980" cy="150" rx="330" ry="240" fill="url(#glow)"/>

    <!-- ruled sheet -->
    <g stroke="#F6F4ED" stroke-opacity="0.045" stroke-width="1">
      <path d="M0 44.5H1200M0 76.5H1200M0 108.5H1200M0 140.5H1200M0 172.5H1200
               M0 204.5H1200M0 236.5H1200M0 268.5H1200M0 300.5H1200"/>
    </g>

    <!-- top meta row -->
    <g class="fade" style="animation-delay:.05s">
      <text x="70" y="52" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
            font-size="12" letter-spacing="3" fill="#17B95E">٠١</text>
      <line x1="104" y1="47" x2="146" y2="47" stroke="#F6F4ED" stroke-opacity="0.28" stroke-width="1"/>
      <text x="160" y="52" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
            font-size="11.5" letter-spacing="3.6" fill="#F6F4ED" fill-opacity="0.5">FULL-STACK DEVELOPER</text>
      <text x="1130" y="52" text-anchor="end"
            font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
            font-size="11.5" letter-spacing="3.6" fill="#F6F4ED" fill-opacity="0.32">EG</text>
    </g>
    <line x1="70" y1="68" x2="1130" y2="68" class="draw" style="animation-delay:.1s"
          stroke="#F6F4ED" stroke-opacity="0.14" stroke-width="1"/>

    <!-- wordmark, rising out of a mask -->
    <g clip-path="url(#wordmask)">
      <text class="rise" style="animation-delay:.28s" x="70" y="172"
            font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
            font-size="82" letter-spacing="4" fill="url(#foil)">AYATO</text>
    </g>

    <line x1="72" y1="192" x2="292" y2="192" class="drawsm" style="animation-delay:.9s"
          stroke="#17B95E" stroke-width="2" stroke-linecap="round"/>

    <!-- the line that actually says something -->
    <g class="fade" style="animation-delay:1.05s">
      <text x="70" y="232" font-family="Georgia,'Times New Roman',serif" font-style="italic"
            font-size="21" fill="#F6F4ED" fill-opacity="0.82">I build the interface, the API, and the schema under both.</text>
      <text x="70" y="262" font-family="system-ui,'Segoe UI',Tahoma,sans-serif"
            font-size="16" fill="#F6F4ED" fill-opacity="0.42">بشتغل على الواجهة والسيرفر وقاعدة البيانات — التلاتة</text>
    </g>

    <!-- stack row -->
    <line x1="70" y1="286" x2="1130" y2="286" class="draw" style="animation-delay:1.2s"
          stroke="#F6F4ED" stroke-opacity="0.1" stroke-width="1"/>
    <g font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
       font-size="11.5" letter-spacing="3.2" fill="#F6F4ED" fill-opacity="0.55">
      <text class="fade" style="animation-delay:1.34s" x="70"  y="313">REACT</text>
      <text class="fade" style="animation-delay:1.42s" x="152" y="313">TYPESCRIPT</text>
      <text class="fade" style="animation-delay:1.50s" x="300" y="313">NODE</text>
      <text class="fade" style="animation-delay:1.58s" x="372" y="313">EXPRESS</text>
      <text class="fade" style="animation-delay:1.66s" x="486" y="313">MONGODB</text>
      <text class="fade" style="animation-delay:1.74s" x="614" y="313">TAILWIND</text>
    </g>
    <rect class="blink" x="732" y="302" width="9" height="14" fill="#17B95E" style="animation-delay:1.9s"/>

    <rect width="1200" height="340" filter="url(#grain)" opacity="0.055"/>
    <rect x=".5" y=".5" width="1199" height="339" rx="10" fill="none"
          stroke="#F6F4ED" stroke-opacity="0.12"/>
  </g>
</svg>
