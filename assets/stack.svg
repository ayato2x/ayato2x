<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="request flow: client to API to database">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/><stop offset="100%" stop-color="#0A0E13"/>
    </linearGradient>
    <clipPath id="scard"><rect width="900" height="230" rx="14"/></clipPath>
    <filter id="sglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g clip-path="url(#scard)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="900" height="230" fill="url(#sbg)"/>
    <text x="32" y="38" fill="#6E7681" font-size="13" letter-spacing="1.5">HOW I BUILD</text>

    <!-- wires -->
    <line x1="272" y1="132" x2="338" y2="132" stroke="#1F2630" stroke-width="2"/>
    <line x1="562" y1="132" x2="628" y2="132" stroke="#1F2630" stroke-width="2"/>

    <!-- request in (blue) / response out (green), looping every 6s -->
    <circle r="4" cy="132" fill="#58A6FF" filter="url(#sglow)">
      <animate attributeName="cx" values="272;338;338" keyTimes="0;0.25;1"
               dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"
               dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cy="132" fill="#58A6FF" filter="url(#sglow)">
      <animate attributeName="cx" values="562;628;628" keyTimes="0;0.25;1"
               dur="6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"
               dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cy="132" fill="#3FB950" filter="url(#sglow)">
      <animate attributeName="cx" values="628;562;562" keyTimes="0;0.25;1"
               dur="6s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"
               dur="6s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cy="132" fill="#3FB950" filter="url(#sglow)">
      <animate attributeName="cx" values="338;272;272" keyTimes="0;0.25;1"
               dur="6s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"
               dur="6s" begin="5s" repeatCount="indefinite"/>
    </circle>

    <!-- CLIENT -->
    <g>
      <rect x="32" y="76" width="240" height="112" rx="10" fill="#0E141B" stroke="#58A6FF" stroke-opacity="0.35"/>
      <rect x="32" y="76" width="240" height="112" rx="10" fill="none" stroke="#58A6FF">
        <animate attributeName="stroke-opacity" values="0;0.7;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="52" y="104" fill="#58A6FF" font-size="11" letter-spacing="1.5">CLIENT</text>
      <text x="52" y="134" fill="#C9D1D9" font-size="17">React · TypeScript</text>
      <text x="52" y="160" fill="#6E7681" font-size="14">Tailwind · Vite</text>
    </g>

    <!-- API -->
    <g>
      <rect x="338" y="76" width="224" height="112" rx="10" fill="#0E141B" stroke="#E3B341" stroke-opacity="0.35"/>
      <rect x="338" y="76" width="224" height="112" rx="10" fill="none" stroke="#E3B341">
        <animate attributeName="stroke-opacity" values="0;0.7;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="358" y="104" fill="#E3B341" font-size="11" letter-spacing="1.5">API</text>
      <text x="358" y="134" fill="#C9D1D9" font-size="17">Node · Express</text>
      <text x="358" y="160" fill="#6E7681" font-size="14">REST · JWT auth</text>
    </g>

    <!-- DATA -->
    <g>
      <rect x="628" y="76" width="240" height="112" rx="10" fill="#0E141B" stroke="#3FB950" stroke-opacity="0.35"/>
      <rect x="628" y="76" width="240" height="112" rx="10" fill="none" stroke="#3FB950">
        <animate attributeName="stroke-opacity" values="0;0.7;0" dur="6s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <text x="648" y="104" fill="#3FB950" font-size="11" letter-spacing="1.5">DATA</text>
      <text x="648" y="134" fill="#C9D1D9" font-size="17">MongoDB</text>
      <text x="648" y="160" fill="#6E7681" font-size="14">Mongoose · Atlas</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="229" rx="14" fill="none" stroke="#222A35"/>
  </g>
</svg>
