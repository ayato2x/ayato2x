<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="ayato2x terminal card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B0F14"/>
      <stop offset="55%"  stop-color="#0D131A"/>
      <stop offset="100%" stop-color="#0A0E13"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58A6FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#8B949E" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <clipPath id="card"><rect x="0" y="0" width="900" height="360" rx="14"/></clipPath>

    <!-- typing masks: 12s loop, three phrases -->
    <clipPath id="t0"><rect x="54" y="278" width="0" height="28">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.10;0.2833;0.30;1" values="0;302;302;0;0"/>
    </rect></clipPath>
    <clipPath id="t1"><rect x="54" y="278" width="0" height="28">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.3333;0.4333;0.6167;0.6333;1" values="0;0;238;238;0;0"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="54" y="278" width="0" height="28">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.6667;0.7667;0.95;0.9667;1" values="0;0;227;227;0;0"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="900" height="360" fill="url(#bg)"/>
    <rect width="900" height="360" fill="url(#grid)"/>

    <!-- slow drifting glow -->
    <circle cx="120" cy="70" r="80" fill="#58A6FF" opacity="0.13" filter="url(#soft)">
      <animate attributeName="cx" dur="19s" repeatCount="indefinite"
               values="120;760;120" calcMode="spline" keyTimes="0;0.5;1"
               keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="cy" dur="23s" repeatCount="indefinite"
               values="70;300;70" calcMode="spline" keyTimes="0;0.5;1"
               keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="700" cy="300" r="70" fill="#3FB950" opacity="0.09" filter="url(#soft)">
      <animate attributeName="cx" dur="27s" repeatCount="indefinite" values="700;200;700"/>
    </circle>

    <!-- light sweep across the card -->
    <rect x="-420" y="0" width="420" height="360" fill="url(#sweep)">
      <animate attributeName="x" from="-420" to="900" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="44" fill="#11161D"/>
    <line x1="0" y1="44" x2="900" y2="44" stroke="#1F2630" stroke-width="1"/>
    <circle cx="26" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="48" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="70" cy="22" r="6" fill="#28C840"/>
    <text x="450" y="27" fill="#6E7681" font-size="13" text-anchor="middle">ayato2x — zsh</text>

    <!-- body -->
    <g font-size="18">
      <text x="32" y="92"  fill="#3FB950">$</text>
      <text x="54" y="92"  fill="#C9D1D9">whoami</text>
      <text x="32" y="122" fill="#8B949E">Ayato</text>
      <text x="98" y="122" fill="#6E7681">— full-stack developer, Egypt</text>

      <text x="32" y="164" fill="#3FB950">$</text>
      <text x="54" y="164" fill="#C9D1D9">stack --list</text>
      <text x="32" y="194" fill="#58A6FF">frontend</text>
      <text x="150" y="194" fill="#8B949E">react · typescript · tailwind</text>
      <text x="32" y="222" fill="#E3B341">backend</text>
      <text x="150" y="222" fill="#8B949E">node · express · mongodb</text>

      <text x="32" y="264" fill="#3FB950">$</text>
      <text x="54" y="264" fill="#C9D1D9">status</text>

      <text x="32" y="298" fill="#3FB950">$</text>
      <g clip-path="url(#t0)"><text x="54" y="298" fill="#C9D1D9">building full-stack web apps</text></g>
      <g clip-path="url(#t1)"><text x="54" y="298" fill="#C9D1D9">react · node · mongodb</text></g>
      <g clip-path="url(#t2)"><text x="54" y="298" fill="#C9D1D9">open to collaborating</text></g>

      <!-- cursor follows the typing edge -->
      <rect y="281" width="10" height="22" fill="#58A6FF" x="54">
        <animate attributeName="x" dur="12s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.2833;0.30;0.3333;0.4333;0.6167;0.6333;0.6667;0.7667;0.95;0.9667;1"
                 values="54;356;356;54;54;292;292;54;54;281;281;54;54"/>
        <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite"
                 values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"/>
      </rect>
    </g>

    <!-- underline draws in, then holds -->
    <line x1="32" y1="332" x2="32" y2="332" stroke="#58A6FF" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x2" from="32" to="330" dur="1.6s" begin="0.4s" fill="freeze"
               calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    </line>

    <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="none" stroke="#222A35" stroke-width="1"/>
  </g>
</svg>
