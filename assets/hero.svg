<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="Ayato — full-stack developer. React, TypeScript, Node, Express, MongoDB.">
  <title>Ayato</title>

  <!--
    Palette sampled from the profile avatar: ink #22271B, sage #9A9F5D,
    moss #575E30, sky #CDE2F5, slate #8EA1A8.
    The avatar is a scratchy ink drawing over hills, so the motion here is the
    same gesture — strokes that draw themselves, then keep breathing.
  -->

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1B2018"/>
      <stop offset="46%"  stop-color="#232A1E"/>
      <stop offset="100%" stop-color="#161A13"/>
    </linearGradient>

    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#575E30" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#575E30" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9A9F5D" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9A9F5D" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#CDE2F5"/>
      <stop offset="70%"  stop-color="#CDE2F5"/>
      <stop offset="100%" stop-color="#9A9F5D"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1200" height="320" rx="10"/></clipPath>

    <style>
      /* Base state is the finished drawing. Entrances run with fill-mode
         backwards, so if animation never plays the card still reads. */
      .ink   { stroke-dasharray: 900; animation: ink 2.2s cubic-bezier(.22,1,.36,1) backwards; }
      .ridge { stroke-dasharray: 1400; animation: ridge 2.6s cubic-bezier(.22,1,.36,1) backwards; }
      .rule  { stroke-dasharray: 1100; animation: ridge 1.6s cubic-bezier(.22,1,.36,1) backwards; }
      .up    { animation: up .9s cubic-bezier(.22,1,.36,1) backwards; }
      .in    { animation: in .8s ease-out backwards; }
      .sway  { animation: sway 9s ease-in-out infinite; }
      .caret { animation: caret 1.1s step-end infinite; }

      @keyframes ink   { from { stroke-dashoffset: 900; } }
      @keyframes ridge { from { stroke-dashoffset: 1400; } }
      @keyframes up    { from { transform: translateY(88px); } }
      @keyframes in    { from { opacity: 0; transform: translateY(9px); } }
      @keyframes sway  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      @keyframes caret { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

      @media (prefers-reduced-motion: reduce) {
        .ink,.ridge,.rule,.up,.in,.sway,.caret { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- ── the hills, drawn as ridgelines that trace themselves ── -->
    <g class="sway">
      <path d="M0 272 C 120 250, 232 286, 352 266 S 588 224, 712 252 S 948 288, 1080 258 L1200 268 V320 H0Z"
            fill="url(#hill)"/>
      <path class="ridge" style="animation-delay:.15s"
            d="M0 272 C 120 250, 232 286, 352 266 S 588 224, 712 252 S 948 288, 1080 258 L1200 268"
            fill="none" stroke="#9A9F5D" stroke-opacity="0.55" stroke-width="1.5"/>
    </g>
    <g class="sway" style="animation-delay:1.2s">
      <path d="M0 300 C 160 280, 300 312, 470 294 S 790 264, 960 292 L1200 280 V320 H0Z"
            fill="url(#hill2)"/>
      <path class="ridge" style="animation-delay:.4s"
            d="M0 300 C 160 280, 300 312, 470 294 S 790 264, 960 292 L1200 280"
            fill="none" stroke="#CDE2F5" stroke-opacity="0.22" stroke-width="1.2"/>
    </g>

    <!-- grass: short strokes that flick in from the ground line -->
    <g stroke="#9A9F5D" stroke-opacity="0.4" stroke-width="1.3" stroke-linecap="round" fill="none">
      <path class="ink" style="animation-delay:.9s;stroke-dasharray:40"  d="M86 316 C 84 306, 92 298, 90 290"/>
      <path class="ink" style="animation-delay:.96s;stroke-dasharray:40" d="M112 318 C 116 308, 108 300, 112 292"/>
      <path class="ink" style="animation-delay:1.02s;stroke-dasharray:40" d="M138 317 C 134 307, 142 299, 140 291"/>
      <path class="ink" style="animation-delay:1.08s;stroke-dasharray:40" d="M980 316 C 976 306, 984 298, 982 290"/>
      <path class="ink" style="animation-delay:1.14s;stroke-dasharray:40" d="M1006 318 C 1010 308, 1002 300, 1006 292"/>
      <path class="ink" style="animation-delay:1.2s;stroke-dasharray:40"  d="M1032 317 C 1028 307, 1036 299, 1034 291"/>
    </g>

    <!-- ── top meta ─────────────────────────────────────────────── -->
    <g class="in" style="animation-delay:.05s"
       font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
       font-size="11.5" letter-spacing="3.6">
      <text x="70" y="52" fill="#9A9F5D">ayato2x</text>
      <text x="1130" y="52" text-anchor="end" fill="#8EA1A8" fill-opacity="0.6">FULL-STACK</text>
    </g>
    <line x1="70" y1="68" x2="1130" y2="68" class="rule" style="animation-delay:.12s"
          stroke="#CDE2F5" stroke-opacity="0.16" stroke-width="1"/>

    <!-- ── the scribbled mark, drawn stroke by stroke ───────────── -->
    <g fill="none" stroke="#22271B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"
       transform="translate(0 6)">
      <!-- a loose ink knot, the same gesture as the avatar -->
      <path class="ink" style="animation-delay:.35s" stroke="#CDE2F5" stroke-opacity="0.9"
            d="M812 96 C 862 76, 926 92, 944 132 C 962 172, 930 208, 886 214 C 842 220, 806 196, 802 164"/>
      <path class="ink" style="animation-delay:.5s" stroke="#9A9F5D" stroke-opacity="0.85"
            d="M806 128 C 840 100, 906 100, 934 134 C 956 160, 944 198, 906 208"/>
      <path class="ink" style="animation-delay:.65s" stroke="#CDE2F5" stroke-opacity="0.5"
            d="M828 158 C 852 128, 902 124, 926 150"/>
      <path class="ink" style="animation-delay:.78s" stroke="#8EA1A8" stroke-opacity="0.55"
            d="M852 190 C 880 178, 910 180, 928 196"/>
      <path class="ink" style="animation-delay:.9s" stroke="#9A9F5D" stroke-opacity="0.45"
            d="M796 172 C 820 196, 858 214, 900 214"/>
    </g>

    <!-- ── wordmark rising ──────────────────────────────────────── -->
    <g clip-path="url(#frame)">
      <clipPath id="wm"><rect x="64" y="86" width="660" height="92"/></clipPath>
      <g clip-path="url(#wm)">
        <text class="up" style="animation-delay:.3s" x="70" y="158"
              font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
              font-size="76" letter-spacing="3" fill="url(#nib)">Ayato</text>
      </g>
    </g>

    <line x1="72" y1="178" x2="258" y2="178" class="ink" style="animation-delay:.95s;stroke-dasharray:200"
          stroke="#9A9F5D" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <g class="in" style="animation-delay:1.05s">
      <text x="70" y="212" font-family="Georgia,'Times New Roman',serif" font-style="italic"
            font-size="20" fill="#CDE2F5" fill-opacity="0.8">I build the interface, the API, and the schema under both.</text>
    </g>

    <!-- ── stack row ────────────────────────────────────────────── -->
    <g class="in" style="animation-delay:1.2s"
       font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace"
       font-size="11.5" letter-spacing="3.2" fill="#8EA1A8" fill-opacity="0.72">
      <text x="70"  y="236">REACT</text>
      <text x="152" y="236">TYPESCRIPT</text>
      <text x="300" y="236">NODE</text>
      <text x="372" y="236">EXPRESS</text>
      <text x="486" y="236">MONGODB</text>
    </g>
    <rect class="caret" x="600" y="225" width="8" height="13" fill="#9A9F5D"/>

    <rect x=".5" y=".5" width="1199" height="319" rx="10" fill="none"
          stroke="#CDE2F5" stroke-opacity="0.14"/>
  </g>
</svg>
